<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zygisk Detach</title><link rel="stylesheet" href="styles.css" type="text/css">
<script type="module" src="index.js"></script></head>
<body><main>
<header><div><span class="eyebrow">KernelSU module</span><h1>Zygisk Detach</h1>
<p id="summary">Loading installed applications…</p></div>
<button type="button" id="refresh">Refresh</button></header>
<p id="status" role="status" aria-live="polite">Loading diagnostics…</p>
<section class="diagnostics" id="doctor" aria-label="Live diagnostic evidence"></section>
<div class="tools"><input id="search" type="search" aria-label="Search packages" placeholder="Search app or package…">
<select id="filter" aria-label="Show packages"><option value="all">All applications</option>
<option value="selected">Selected</option><option value="available">Installed</option>
<option value="missing">Missing</option></select></div>
<div class="actions"><button type="button" id="select-visible">Select visible</button>
<button type="button" id="undo">Undo pending</button><button type="button" id="backup">Backup</button>
<button type="button" id="restore">Restore previous</button><button type="button" id="export">Export selection</button>
<button type="button" id="diagnostics">Export diagnostics</button></div>
<textarea id="export-box" hidden readonly aria-label="Exported packages"></textarea>
<section id="apps-list" aria-label="Select applications to detach"></section>
<footer><button type="button" id="apply" disabled>No pending changes</button>
<small>Saved configuration ≠ proven prevention of Google Play updates.</small></footer>
</main></body></html>
